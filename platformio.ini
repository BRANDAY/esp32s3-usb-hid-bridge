; USBHelper — учебный проект для ESP32 mini
;
; Основные команды (выполнять в папке проекта):
;   python -m platformio run              — собрать прошивку
;   python -m platformio run -t upload    — собрать и прошить плату
;   python -m platformio device monitor   — смотреть вывод платы (выход: Ctrl+C)
;
; "ESP32 mini" бывают на разных чипах — ниже готовые варианты.
; У нас плата на ESP32-S3 (определили esptool-ом 30.07.2026): чип с 4МБ flash
; и 2МБ PSRAM, USB встроен в чип, порт COM5. Поэтому по умолчанию — s3mini.

[platformio]
default_envs = s3mini

; ── НАША ПЛАТА: S3 mini (чип ESP32-S3, тип LOLIN S3 mini) ───────────
; USB-Serial/JTAG встроен в чип. Вместо обычного светодиода — RGB
; (WS2812) на GPIO47: digitalWrite(LED_BUILTIN) мигает белым.
[env:s3mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Классическая ESP32 mini ─────────────────────────────────────────
; MH-ET LIVE MiniKit / Wemos D1 mini ESP32, модуль ESP32-WROOM-32.
; На плате отдельный USB-чип (CH340/CP2102), светодиод на GPIO2.
[env:esp32mini]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ── LOLIN S2 mini (чип ESP32-S2) ────────────────────────────────────
; USB встроен в чип. Прошивать так: python -m platformio run -e s2mini -t upload
[env:s2mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ── LOLIN C3 mini (чип ESP32-C3) ────────────────────────────────────
; USB встроен в чип. Прошивать так: python -m platformio run -e c3mini -t upload
[env:c3mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
