; esp32s3-usb-hid-bridge — build configuration (PlatformIO)
;
; Common commands (run inside the project folder):
;   python -m platformio run              — build the firmware
;   python -m platformio run -t upload    — build and flash the board
;   python -m platformio device monitor   — watch the board output (Ctrl+C to exit)
;
; Board: WEMOS LOLIN S3 Mini (ESP32-S3). Native USB is built into the chip.
;
; Flashing the HID firmware needs two manual steps (native USB has no
; auto-reset once the board runs as a keyboard):
;   1) enter download mode: unplug USB, hold BOOT, plug back in, release BOOT
;   2) after upload, power-cycle the board (unplug/replug or press RST)

[platformio]
default_envs = s3hid

; ── S3 HID: composite USB device (keyboard + mouse + virtual COM port) ──
; ARDUINO_USB_MODE=0 selects USB-OTG (TinyUSB); HID does not work in the
; default hardware-CDC mode (=1). CDC_ON_BOOT=0 because the COM port is
; created explicitly with a USBCDC object in the firmware (the automatic
; CDC-on-boot path did not bring up the port when combined with HID).
[env:s3hid]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -UARDUINO_USB_MODE
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
