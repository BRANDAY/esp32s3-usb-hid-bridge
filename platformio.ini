; USBHelper — учебный проект для ESP32 mini
;
; Основные команды (выполнять в папке проекта):
;   python -m platformio run              — собрать прошивку (по умолч. окружение)
;   python -m platformio run -t upload    — собрать и прошить плату
;   python -m platformio device monitor   — смотреть вывод платы (выход: Ctrl+C)
;   python -m platformio run -e s3hid -t upload   — прошить конкретное окружение
;
; У нас плата на ESP32-S3 (определили esptool-ом 30.07.2026): 4МБ flash,
; USB встроен в чип, порт COM5.
;
; В проекте два скетча — за это отвечает build_src_filter в каждом окружении:
;   src/main.cpp          — мигалка + чат по serial (окружение s3mini)
;   src/hid_composite.cpp — USB-клавиатура+мышь+COM-порт (окружение s3hid)
; По умолчанию собирается s3hid — то, над чем работаем сейчас.

[platformio]
default_envs = s3hid

; ── S3 HID: составное USB-устройство (клавиатура + мышь + VCP) ──────
; ГЛАВНОЕ: ARDUINO_USB_MODE=0 (USB-OTG/TinyUSB) — без этого HID не работает.
; CDC_ON_BOOT=0: COM-порт (CDC) создаём ЯВНО объектом USBSerial в коде —
; автоматический CDC_ON_BOOT в связке с HID у нас порт не поднимал.
[env:s3hid]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<hid_composite.cpp>
build_flags =
    -UARDUINO_USB_MODE
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; ── S3 mini: первая учебная прошивка (мигалка + serial-чат) ─────────
; USB-Serial/JTAG встроен в чип. RGB-светодиод (WS2812) на GPIO47.
[env:s3mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Классическая ESP32 mini ─────────────────────────────────────────
; MH-ET LIVE MiniKit / Wemos D1 mini ESP32, модуль ESP32-WROOM-32.
; На плате отдельный USB-чип (CH340/CP2102), светодиод на GPIO2.
[env:esp32mini]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main.cpp>

; ── LOLIN S2 mini (чип ESP32-S2) ────────────────────────────────────
; USB встроен в чип. Прошивать так: python -m platformio run -e s2mini -t upload
[env:s2mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ── LOLIN C3 mini (чип ESP32-C3) ────────────────────────────────────
; USB встроен в чип. Прошивать так: python -m platformio run -e c3mini -t upload
[env:c3mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
